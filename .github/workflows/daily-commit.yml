name: Daily Auto Commit

on:
  schedule:
    # 每天UTC时间 2:10 和 14:10（北京时间 10:10 和 22:10）各执行一次
    - cron: '10 2 * * *'
    - cron: '10 14 * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run auto commit script
        run: python .github/scripts/auto_commit.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # 检查是否有变更需要提交
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            # 获取 commit message（由脚本生成到文件中）
            COMMIT_MSG=$(cat .commit_message.txt 2>/dev/null || echo "chore: daily code maintenance")
            git commit -m "$COMMIT_MSG"
            git push
            echo "Committed with message: $COMMIT_MSG"
          fi
